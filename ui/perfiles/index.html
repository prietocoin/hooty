<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030611">
  <meta name="description" content="PerfilHub: directorio de socios, reglas y plantillas.">
  <title>PerfilHub Engine - Directorio de Socios</title>
  <link rel="icon" type="image/svg+xml" href="../shared/brand/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/tailwind.css?v=20261024_99_FIX_TASAS">
  <link rel="stylesheet" href="./css/perfiles.css?v=20261024_99_FIX_TASAS">
  <link rel="stylesheet" href="../shared/css/mobile.css?v=20261024_99_FIX_TASAS">
</head>

<body class="bg-[#030611] text-slate-100 min-h-screen p-4 md:p-6">
  <div class="max-w-7xl mx-auto space-y-6 glauk-main">

    <!-- ENCABEZADO Y CONTROLES GLOBALES -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800/80 pb-4">
      <div>
        <a href="/comprobantes/" class="inline-flex items-center gap-1 text-[11px] font-semibold text-slate-400 hover:text-cyan-300 transition-colors mb-2 no-underline">← Volver a Comprobantes</a>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          <span>Directorio de Socios</span>
          <span class="text-xs font-mono px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">PERFILHUB</span>
        </h1>
        <p id="perfiles-total" class="text-xs text-slate-400 font-mono mt-0.5">Total: 0 socios registrados</p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button id="btn-refrescar" type="button" class="px-3 py-1.5 rounded-lg border border-amber-500/40 bg-amber-500/10 text-amber-400 text-xs font-semibold hover:bg-amber-500/20 transition flex items-center gap-1.5">🌐 FUNDDA</button>
        <button id="btn-apagar-todos" type="button" class="px-3 py-1.5 rounded-lg border border-rose-500/40 bg-rose-500/10 text-rose-400 text-xs font-semibold hover:bg-rose-500/20 transition flex items-center gap-1.5">🔴 Apagar Todos</button>
        <button id="btn-memorizar" type="button" class="px-3 py-1.5 rounded-lg border border-purple-500/40 bg-purple-600/20 text-purple-300 text-xs font-semibold hover:bg-purple-600/30 transition flex items-center gap-1.5">📌 Guardar</button>
        <button id="btn-restaurar" type="button" class="px-3 py-1.5 rounded-lg border border-emerald-500/40 bg-emerald-500/10 text-emerald-400 text-xs font-semibold hover:bg-emerald-500/20 transition flex items-center gap-1.5">📄 Restaurar</button>
        <button id="btn-nuevo" type="button" class="px-3.5 py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold transition flex items-center gap-1">+ Nuevo</button>
      </div>
    </header>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="relative">
      <input id="perfiles-busqueda" type="text" placeholder="Buscar socio..." autocomplete="off" class="w-full bg-[#070e23] border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500/60 focus:ring-1 focus:ring-cyan-500/40 transition">
    </div>

    <!-- LISTADO DE SOCIOS -->
    <div id="perfiles-lista" class="space-y-2.5" aria-live="polite"></div>
  </div>

  <div id="perfiles-modal-root"></div>
  <script src="../config.js"></script>
  <script type="module" src="./js/main.js?v=20261024_99_FIX_TASAS"></script>
  <script type="module" src="/shared/js/mobile-nav.js?v=20261024_99_FIX_TASAS"></script>
</body>
</html>
