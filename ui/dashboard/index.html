<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Glauk2 Engine</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#030611">
  <link rel="canonical" href="/comprobantes/?vista=dashboard">
  <meta http-equiv="refresh" content="0; url=/comprobantes/?vista=dashboard">
  <script>
    // Ruta oficial del Dashboard: el contenido (Balance, Pendientes e
    // Inspección de Lotes) vive en el SPA de comprobantes. Se limpian los
    // service workers heredados para no servir una versión cacheada.
    (function () {
      var destino = '/comprobantes/?vista=dashboard';
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (registros) {
            registros.forEach(function (registro) { registro.unregister(); });
          })
          .catch(function () {});
      }
      window.location.replace(destino);
    })();
  </script>
</head>
<body style="margin:0;background:#030611;color:#94a3b8;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh">
  <p>Redirigiendo al Dashboard… <a href="/comprobantes/?vista=dashboard" style="color:#22d3ee">Continuar</a></p>
</body>
</html>
