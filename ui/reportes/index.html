<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes retirado · Glauk2 Engine</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#030611">
  <link rel="canonical" href="/dashboard/">
  <meta http-equiv="refresh" content="0; url=/dashboard/">
  <script>
    // El "Constructor Visual" de Reportes quedó obsoleto. El estado de cuenta
    // formal se genera desde la Inspección de Lotes (Dashboard) o desde cada
    // comprobante. Se elimina la caché del service worker antiguo antes de
    // redirigir para que ningún cliente siga viendo la vista retirada.
    (function () {
      var destino = '/dashboard/';
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (registros) {
            registros.forEach(function (registro) { registro.unregister(); });
          })
          .catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys()
          .then(function (claves) {
            return Promise.all(claves.map(function (clave) { return caches.delete(clave); }));
          })
          .catch(function () {});
      }
      window.location.replace(destino);
    })();
  </script>
</head>
<body style="margin:0;background:#030611;color:#94a3b8;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh">
  <p>El módulo Reportes fue retirado. <a href="/dashboard/" style="color:#22d3ee">Ir al Dashboard</a></p>
</body>
</html>
