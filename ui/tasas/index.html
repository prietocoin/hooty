<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TasasHub Engine - Control Global</title>
  <link rel="icon" type="image/png" href="./icon-512.png"><link rel="shortcut icon" type="image/png" href="./icon-512.png"><link rel="apple-touch-icon" href="./icon-512.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1326">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TasasHub">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/controls.css">
  <link rel="stylesheet" href="./css/cards.css">
  <link rel="stylesheet" href="./css/feedback.css">
  <link rel="stylesheet" href="./css/overlays.css">
  <link rel="stylesheet" href="../shared/css/mobile.css?v=20261024_09">
</head>
<body class="tasas-app">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">⚡</div>
        <div>
          <h1>TasasHub Engine</h1>
          <p>Control Global</p>
        </div>
      </div>
      <div class="header-actions"><a class="back-link" href="/comprobantes/" aria-label="Volver a Comprobantes" title="Volver a Comprobantes"><span aria-hidden="true">&#8592;</span><span class="hide-sm">Comprobantes</span></a>
        <button id="btnInstallPWA" class="install-btn hidden" type="button">
          📲 <span>Instalar App</span>
        </button></div>
    </div>
  </header>
  <main class="app-main glauk-main">
    <div class="tabs tabs-single" aria-label="Monitor Global">
      <span class="tab active">📊 Monitor Global</span>
    </div>
    <section class="tab-panel">
      <div class="panel">
        <div class="monitor-top">
          <span class="monitor-title">
            <span class="live-dot" aria-hidden="true"></span>
            MONITOR DE VARIACIÓN &amp; PUBLICACIÓN
          </span>
          <div class="monitor-actions">
            <span id="lblLoteActual" class="lote-badge">Lote en Prod: --</span>
            <button id="btnBorrarLote" class="soft-btn danger-soft" type="button">
              🗑️ <span class="hide-sm">Borrar Lote</span>
            </button>
            <button id="btnRemesas" class="btn btn-green" type="button">
              🚀 Enviar Tasa Remesas
            </button>
          </div>
        </div>
        <div id="gridMonitor" class="monitor-grid"></div>
        <div class="monitor-footer">
          <button id="btnGuardarLote" class="btn btn-save" type="button">
            💾 <span>Guardar en tasa</span>
          </button>
          <div class="monitor-footer-actions">
            <label class="switch-label">
              <span>Prueba Lote:</span>
              <input type="checkbox" id="globalTestSwitch" class="sr-only" checked>
              <span class="switch" aria-hidden="true"></span>
            </label>
            <button id="btnPublicar" class="btn btn-publish" type="button">
              ⚡ <span>Publicar Lote a Socios ON</span>
            </button>
            <button id="btnHoo" class="btn btn-purple" type="button">
              📑 <span>Traer Borrador Hoo</span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="modalDeleteBatch" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="tituloBorrarLote">
    <div class="modal-card modal-sm">
      <div class="modal-handle" aria-hidden="true"></div>
      <div class="modal-head">
        <h3 id="tituloBorrarLote">🗑️ Borrar Lote Publicado</h3>
        <button type="button" class="close-btn close-btn-plain modal-close" data-close-modal="modalDeleteBatch" aria-label="Cerrar">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-copy">
          Ingresa el número de lote a eliminar de la base de datos (Ejemplo:
          <strong class="text-cyan">T068</strong>):
        </p>
        <input type="text" id="txtBatchIdToDelete" placeholder="T000" autocomplete="off" inputmode="text"
          class="text-input modal-input">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" data-close-modal="modalDeleteBatch">Cancelar</button>
        <button id="btnConfirmarBorrar" type="button" class="btn btn-danger">Borrar Lote</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite">Mensaje</div>
  <script src="../config.js"></script>
  <script type="module" src="./js/main.js"></script>
  <script type="module" src="/shared/js/mobile-nav.js?v=20261024_09"></script>
</body>
</html>
